sections:
  - id: who
    h: Who runs this site
    p:
      - This comparison is maintained by Plugixa, the company that makes Plugixa CRM, one of the plugins compared. That is a conflict of interest, and this page explains what we do about it.
      - Every page carries a notice saying who maintains the site. Our plugin is marked in the tables. It is listed first in a ranking only where the checked data supports that, and its page lists its weaknesses in the same way as every other plugin's.
  - id: sources
    h: Where the values come from
    p:
      - For competing plugins, each value comes from the vendor's own material, meaning its wordpress.org listing, its feature and documentation pages, and its pricing page. Each checked value in a table links to the page it was taken from.
      - For Plugixa CRM, values come from reading the plugin's source code, and are linked to its public documentation. We applied the same definitions, which is why it is marked "No" for marketing automation and for invoices.
      - Install counts, ratings, version numbers and update dates are read from the public wordpress.org plugin API by a script, not typed in by hand. Plugixa CRM is not on wordpress.org yet, so it has no numbers there.
  - id: labels
    h: What the labels mean
    p:
      - '"Yes" means the plugin does what the feature definition says. "Partial" means it does part of it, and a note says what is missing. "No" means it does not. "Not checked" means we could not confirm the value from the vendor''s own pages, so we make no claim.'
      - '"Free" means the feature is in the free version. "Paid" names the lowest plan that includes it, and "Paid add-on" means it is sold as a separate extension, as far as the vendor states.'
      - '"Not checked" is not a polite "No". Many of those features probably exist. We would sooner leave a gap than guess.'
  - id: kinds
    h: Four kinds of CRM plugin
    p:
      - '"CRM" covers very different products. A sales CRM is built around companies, deals and a pipeline. An email marketing CRM is built around a contact list, tags and automated email. A business suite adds a CRM to HR or accounting. A connector puts a form or chat on your site and keeps the CRM itself on the vendor''s servers.'
      - Each plugin is labelled with its kind, because a "No" in the pipeline rows means little for an email marketing tool, and the reverse.
  - id: limits
    h: What we did not do
    p:
      - We did not install and test every plugin by hand, and we did not run speed tests. Values reflect what vendors say about their own products.
      - There is no overall score and no star rating from us. The ratings shown are the public wordpress.org ratings, with the number of ratings beside them.
      - Prices are the ones shown on the day we checked. Where a vendor showed a promotional price, we give the regular price too. HubSpot is priced per seat per month; we show the yearly cost of one seat.
  - id: rankings
    h: How rankings and picks are decided
    p:
      - Best-of pages rank plugins for one stated need. Each pick has a reason that can be checked against the feature table.
      - We look at what the free version includes, the price per site, how recently the plugin was updated, and its public rating and install count.
  - id: corrections
    h: Corrections
    p:
      - If a value is wrong or out of date, open an issue on the GitHub repository with a link to the vendor page that shows the correct value. Vendors are welcome to do this for their own plugins.
      - Data and text are published under CC BY 4.0, so you may reuse them with attribution.
