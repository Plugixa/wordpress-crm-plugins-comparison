sections:
  - id: who
    h: Chi gestisce questo sito
    p:
      - "Questo confronto è curato da Plugixa, l'azienda che sviluppa Plugixa CRM, uno dei plugin messi a confronto. È un conflitto di interessi, e questa pagina spiega che cosa facciamo al riguardo."
      - "Ogni pagina riporta un avviso che dice chi cura il sito. Il nostro plugin è contrassegnato nelle tabelle. Compare al primo posto in una classifica solo dove i dati verificati lo giustificano, e la sua pagina ne elenca i punti deboli allo stesso modo di quella di ogni altro plugin."
  - id: sources
    h: Da dove provengono i valori
    p:
      - "Per i plugin concorrenti, ogni valore proviene dal materiale del produttore stesso, cioè dalla sua scheda su wordpress.org, dalle sue pagine delle funzioni e della documentazione e dalla sua pagina dei prezzi. Ogni valore verificato in una tabella rimanda alla pagina da cui è stato preso."
      - "Per Plugixa CRM, i valori provengono dalla lettura del codice sorgente del plugin e rimandano alla sua documentazione pubblica. Abbiamo applicato le stesse definizioni, ed è per questo che è indicato come \"No\" per la marketing automation e per le fatture."
      - "Numero di installazioni, valutazioni, numeri di versione e date di aggiornamento vengono letti da uno script dall'API pubblica dei plugin di wordpress.org, non inseriti a mano. Plugixa CRM non è ancora su wordpress.org, quindi lì non ha numeri."
  - id: labels
    h: Che cosa significano le etichette
    p:
      - "\"Sì\" significa che il plugin fa ciò che dice la definizione della funzione. \"Parziale\" significa che ne fa una parte, e una nota spiega che cosa manca. \"No\" significa che non lo fa. \"Non verificato\" significa che non siamo riusciti a confermare il valore dalle pagine del produttore, quindi non affermiamo nulla."
      - "\"Gratis\" significa che la funzione è nella versione gratuita. \"A pagamento\" indica il piano più basso che la include, e \"Add-on a pagamento\" significa che è venduta come estensione separata, per quanto dichiarato dal produttore."
      - "\"Non verificato\" non è un modo gentile per dire \"No\". Molte di quelle funzioni probabilmente esistono. Preferiamo lasciare un vuoto piuttosto che tirare a indovinare."
  - id: kinds
    h: Quattro tipi di plugin CRM
    p:
      - "\"CRM\" indica prodotti molto diversi. Un CRM per le vendite è costruito attorno ad aziende, trattative e una pipeline. Un CRM per l'email marketing è costruito attorno a un elenco di contatti, tag ed email automatiche. Una suite aziendale aggiunge un CRM alla gestione del personale o alla contabilità. Un connettore mette un modulo o una chat sul tuo sito e tiene il CRM vero e proprio sui server del produttore."
      - "Ogni plugin è etichettato con il suo tipo, perché un \"No\" nelle righe della pipeline conta poco per uno strumento di email marketing, e viceversa."
  - id: limits
    h: Che cosa non abbiamo fatto
    p:
      - "Non abbiamo installato e provato a mano ogni plugin, e non abbiamo eseguito test di velocità. I valori riflettono ciò che i produttori dicono dei propri prodotti."
      - "Non c'è un punteggio complessivo e non c'è una nostra valutazione a stelle. Le valutazioni mostrate sono quelle pubbliche di wordpress.org, con accanto il numero di valutazioni."
      - "I prezzi sono quelli mostrati nel giorno della nostra verifica. Dove un produttore mostrava un prezzo promozionale, indichiamo anche il prezzo pieno. HubSpot ha un prezzo per postazione al mese; indichiamo il costo annuale di una postazione."
  - id: rankings
    h: Come vengono decise classifiche e scelte
    p:
      - "Le pagine dei migliori plugin mettono in classifica i plugin per una sola esigenza dichiarata. Ogni scelta ha una motivazione che si può verificare sulla tabella delle funzioni."
      - "Guardiamo che cosa include la versione gratuita, il prezzo per sito, quanto è recente l'ultimo aggiornamento del plugin, la sua valutazione pubblica e il numero di installazioni."
  - id: corrections
    h: Correzioni
    p:
      - "Se un valore è sbagliato o non aggiornato, apri una issue nel repository GitHub con un link alla pagina del produttore che mostra il valore corretto. I produttori sono invitati a farlo per i propri plugin."
      - "Dati e testi sono pubblicati con licenza CC BY 4.0, quindi puoi riutilizzarli citando la fonte."
