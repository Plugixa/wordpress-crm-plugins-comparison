items:
  - q: Welches ist das beste WordPress CRM-Plugin?
    a: Das hängt davon ab, wofür Sie das CRM brauchen. Für E-Mail-Marketing hat FluentCRM die größte Nutzerbasis unter den selbst gehosteten Lösungen und eine gute Bewertung. Für ein kostenloses gehostetes CRM HubSpot. Für Angebote und Rechnungen Jetpack CRM. Für eine Vertriebspipeline, Support-Fälle und Team-Berechtigungen ohne Bezahlung Plugixa CRM.
  - q: Welches WordPress CRM-Plugin ist kostenlos?
    a: "Alle sieben haben eine kostenlose Version, aber sie halten unterschiedliche Dinge zurück. Plugixa CRM bietet Deals, Pipelines, Fälle und ein Kundenportal kostenlos. FluentCRM und Groundhogg bieten E-Mail-Kampagnen und Automatisierung kostenlos. Jetpack CRM bietet Angebote und Rechnungen kostenlos. Der kostenlose gehostete Tarif von HubSpot ist auf zwei Nutzer und 1.000 Kontakte begrenzt."
  - q: Welche WordPress CRM-Plugins haben eine Vertriebspipeline?
    a: "Plugixa CRM und HubSpot haben Deals auf einem Kanban-Board in ihren kostenlosen Versionen. WP ERP und Groundhogg haben eines in einem kostenpflichtigen Tarif. FluentCRM und Jetpack CRM haben weder Deals noch eine Pipeline, und WP-CRM System hat Verkaufschancen ohne Phasen."
  - q: Was ist der Unterschied zwischen einem E-Mail-Marketing-CRM und einem Vertriebs-CRM?
    a: Ein E-Mail-Marketing-CRM ist um eine Kontaktliste, Tags und automatisierte E-Mails herum aufgebaut; FluentCRM und Groundhogg sind Beispiele dafür. Ein Vertriebs-CRM ist um Firmen, Deals und eine Pipeline herum aufgebaut, mit Aktivitäten und Berechtigungen für ein Team; Plugixa CRM ist eines davon. Viele Unternehmen brauchen das eine eher als das andere.
  - q: Wo werden meine CRM-Daten gespeichert?
    a: "Sechs der sieben Plugins speichern die Daten in Ihrer WordPress-Datenbank. HubSpot ist die Ausnahme: Sein Plugin verbindet Ihre Website mit dem gehosteten CRM von HubSpot, und Kontakte und Deals liegen auf den Servern von HubSpot."
  - q: Kann ich von einem CRM-Plugin zu einem anderen wechseln?
    a: Kontakte und Firmen lassen sich meist per CSV-Export und -Import übertragen. Deals, E-Mail-Verlauf, Tickets und Rechnungen oft nicht. Führen Sie den Import zuerst auf einer Staging-Kopie durch und prüfen Sie, was übernommen wurde.
  - q: Wer betreibt diesen Vergleich?
    a: Plugixa, das Unternehmen hinter Plugixa CRM. Das ist ein Interessenkonflikt. Um ihn zu begrenzen, verlinkt jeder Wert auf seine Quelle, jede Plugin-Seite nennt neben den Stärken auch die Schwächen, und unser eigenes Plugin steht nur dort auf dem ersten Platz, wo die Daten das stützen.
  - q: Wie oft werden die Daten aktualisiert?
    a: Installationszahlen, Bewertungen und Versionsnummern werden jede Woche über die API von wordpress.org abgerufen. Funktionen und Preise prüfen wir von Hand, und jede Plugin-Seite zeigt das Datum der letzten Prüfung.
