# Feature taxonomy. Labels and definitions live in src/i18n/{locale}/features.yaml.
# type: support = yes / partial / no / unverified;  text = short free text.
areas:
  - id: records
    features:
      - { id: records.contacts, type: support }
      - { id: records.companies, type: support }
      - { id: records.custom_fields, type: support }
      - { id: records.duplicates, type: support }
